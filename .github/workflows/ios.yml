name: App iPhone e Mac

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Versione di Xcode
        run: xcodebuild -version

      - name: Compila per il simulatore iPhone
        run: |
          xcodebuild build \
            -project ios/KeepGoing.xcodeproj \
            -scheme KeepGoing \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u
              tail -80 build.log
              exit 1
            }
          echo "Avvisi del compilatore (iPhone):"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sort -u || true

      - name: Compila per il Mac
        run: |
          xcodebuild build \
            -project ios/KeepGoing.xcodeproj \
            -scheme KeepGoing \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO > build-mac.log 2>&1 || {
              grep -E "error:" build-mac.log | sort -u
              tail -80 build-mac.log
              exit 1
            }
          echo "Avvisi del compilatore (Mac):"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build-mac.log | sort -u || true

      - name: Avvia nel simulatore iPhone e fai gli screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in runtimes if ".iOS-" in k), key=lambda k: [int(n) for n in k.split("iOS-")[1].split("-")])
          print(next(d["udid"] for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/KeepGoing.app
          mkdir -p screenshots
          # Una schermata per volta (vedi RootView.swift, solo in Debug)
          for screen in search results compare key flights detail settings; do
            xcrun simctl terminate "$UDID" com.lilricky97.keepgoing 2>/dev/null || true
            xcrun simctl launch "$UDID" com.lilricky97.keepgoing -kgScreen "$screen"
            sleep 12
            xcrun simctl io "$UDID" screenshot "screenshots/$screen.png"
          done
          xcrun simctl spawn "$UDID" launchctl list > processes.txt
          grep -q keepgoing processes.txt || { echo "L'app si è chiusa da sola (crash?)"; exit 1; }

      - name: Avvia l'app per Mac e fai gli screenshot
        run: |
          APP=build-mac/Build/Products/Debug/KeepGoing.app
          mkdir -p screenshots
          for screen in results key flights detail settings; do
            open -n -W "$APP" --args -kgScreen "$screen" &
            sleep 15
            PID=$(pgrep -n -f "KeepGoing.app/Contents/MacOS/KeepGoing") || { echo "L'app per Mac si è chiusa da sola (crash?)"; exit 1; }
            screencapture -x "screenshots/mac-$screen.png" || echo "screenshot non disponibile"
            # Se l'app fosse bloccata, qui si vede dove (stack del thread principale)
            sample "$PID" 2 -file "screenshots/mac-$screen-sample.txt" > /dev/null 2>&1 || true
            osascript -e 'tell application "KeepGoing" to quit' || kill "$PID"
            sleep 3
            pkill -f "KeepGoing.app/Contents/MacOS/KeepGoing" || true
            sleep 1
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
