name: App iPhone

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Versione di Xcode
        run: xcodebuild -version

      - name: Compila per il simulatore
        run: |
          xcodebuild build \
            -project ios/KeepGoing.xcodeproj \
            -scheme KeepGoing \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u
              tail -80 build.log
              exit 1
            }
          echo "Avvisi del compilatore:"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sort -u || echo "nessuno"

      - name: Avvia nel simulatore e fai gli screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in runtimes if ".iOS-" in k), key=lambda k: [int(n) for n in k.split("iOS-")[1].split("-")])
          print(next(d["udid"] for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/KeepGoing.app
          mkdir -p screenshots
          # Una schermata per volta (vedi RootView.swift, solo in Debug)
          for screen in search results flights detail settings; do
            xcrun simctl terminate "$UDID" com.lilricky97.keepgoing 2>/dev/null || true
            xcrun simctl launch "$UDID" com.lilricky97.keepgoing -kgScreen "$screen"
            sleep 12
            xcrun simctl io "$UDID" screenshot "screenshots/$screen.png"
          done
          xcrun simctl spawn "$UDID" launchctl list > processes.txt
          grep -q keepgoing processes.txt || { echo "L'app si è chiusa da sola (crash?)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
